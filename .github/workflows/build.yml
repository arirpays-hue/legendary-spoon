name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Ensure persistent signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/app-signing.jks
            echo "Using persistent keystore from GitHub Secrets."
          elif [ -f "app/app-signing.jks" ]; then
            echo "Using existing repository keystore."
          else
            keytool -genkeypair -v \
              -keystore app/app-signing.jks \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias translator_key \
              -storepass translator123 \
              -keypass translator123 \
              -dname "CN=ScreenTranslator, OU=App, O=ScreenTranslator, L=Jerusalem, S=IL, C=IL"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/app-signing.jks
            git commit -m "Persist app signing keystore for in-place updates [skip ci]" || true
            git push || echo "::warning::Enable Read and write permissions under Settings -> Actions -> General so updates never require uninstalling."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Assemble Debug APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Clean secret keystore if decoded from Secrets
        if: always()
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            rm -f app/app-signing.jks
          fi

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
