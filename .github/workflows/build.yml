name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Ensure persistent signing keystore
        run: |
          if [ ! -f "app/app-signing.jks" ]; then
            keytool -genkeypair -v \
              -keystore app/app-signing.jks \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias translator_key \
              -storepass translator123 \
              -keypass translator123 \
              -dname "CN=ScreenTranslator, OU=App, O=ScreenTranslator, L=Jerusalem, S=IL, C=IL"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/app-signing.jks
            git commit -m "Add persistent signing keystore [skip ci]" || true
            git push || echo "Note: Enable Read and write permissions under Settings -> Actions -> General to save the keystore automatically."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
